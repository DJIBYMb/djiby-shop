<!DOCTYPE html>
<html>
<head>
<title>DJIBY SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:white;color:black}
header{background:black;color:white;text-align:center;padding:20px;font-size:34px;font-weight:bold;display:flex;flex-direction:column;align-items:center}
.logo{width:90px;height:90px;object-fit:cover;border-radius:50%;margin-bottom:10px}
nav{text-align:center;background:#eee;padding:15px}
nav a{color:black;text-decoration:none;margin:10px;font-weight:bold}
.hero{text-align:center;padding:30px}
.search{text-align:center;padding:15px}
.search input{width:85%;max-width:500px;padding:15px;border:2px solid black;border-radius:12px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{border:2px solid black;border-radius:15px;overflow:hidden;box-shadow:0 4px 10px #aaa}
.simple-card{cursor:pointer;position:relative}
.product-main-img{width:100%;height:230px;object-fit:cover;display:block}
.simple-price{position:absolute;right:8px;bottom:8px;background:black;color:white;padding:8px 10px;border-radius:8px;font-weight:bold}
.slider-detail{position:relative}
#detailMainImage{width:100%;height:260px;object-fit:cover;border-radius:15px}
.slide-btn{position:absolute;top:45%;background:black;color:white;border:none;border-radius:50%;width:30px;height:30px}
.prev{left:5px}
.next{right:5px}
.desc{background:#f4f4f4;padding:10px;border-radius:10px;font-size:13px}
.price{font-weight:bold;margin:10px 0;font-size:18px}
.stock{margin:10px 0;font-weight:bold;color:green}
.btn{background:black;color:white;padding:12px;border:none;border-radius:10px;width:100%;font-weight:bold}
.out{background:gray;cursor:not-allowed}
.contact{background:black;color:white;text-align:center;padding:30px}
.contact a{display:block;color:white;text-decoration:none;margin:12px}
#topBtn{position:fixed;right:20px;bottom:20px;border-radius:50%;width:55px;height:55px;background:black;color:white;font-size:25px}
.modal,#robot,#bigImage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);justify-content:center;align-items:center;z-index:9999}
#robot{display:flex}
.box{background:white;color:black;padding:25px;border-radius:20px;width:90%;max-width:420px;text-align:center;max-height:90vh;overflow:auto}
.box input{width:100%;padding:13px;margin:8px 0;border:2px solid black;border-radius:10px;box-sizing:border-box}
.back-btn{position:absolute;top:20px;left:20px;background:black;color:white;border:none;padding:10px 18px;border-radius:10px;font-weight:bold;cursor:pointer;width:auto}
#bigImage img{max-width:90%;max-height:85%}
.back{position:absolute;top:20px;left:20px;color:white;font-size:45px;cursor:pointer}
</style>
</head>

<body>

<div id="robot">
  <div class="box">
    <h2>Vérification sécurité</h2>
    <p>Combien fait 4 + 3 ?</p>
    <input id="robotAnswer" type="number" placeholder="Réponse">
    <button class="btn" onclick="checkRobot()">Entrer</button>
    <p id="robotError"></p>
  </div>
</div>

<header>
  <img src="md.jpeg" class="logo">
  <div>DJIBY SHOP</div>
</header>

<nav>
  <a href="#products">Articles</a>
  <a href="#contact">Contact</a>
</nav>

<section class="hero">
  <h1>Bienvenue sur DJIBY SHOP 🛒</h1>
  <p>Produits de qualité — paiement sécurisé</p>
</section>

<div class="search">
  <input id="searchInput" onkeyup="searchProducts()" placeholder="Rechercher un produit...">
</div>

<section id="products" class="products"></section>

<div id="productDetail" class="modal">
  <button onclick="closeProductDetails()" class="back-btn">⬅ Retour</button>

  <div class="box">
    <h2 id="detailName"></h2>

    <div class="slider-detail">
      <button class="slide-btn prev" onclick="changeDetailImage(-1)">‹</button>
      <img id="detailMainImage">
      <button class="slide-btn next" onclick="changeDetailImage(1)">›</button>
    </div>

    <div class="price" id="detailPrice"></div>
    <div class="stock" id="detailStock"></div>
    <div class="desc" id="detailDescription"></div>
    <br>
    <button class="btn" id="detailPayBtn">Payer ce produit</button>
  </div>
</div>

<section id="contact" class="contact">
  <h2>Contact</h2>
  <a href="mailto:djibyshop14@gmail.com">📧 mail</a>
  <a href="https://www.tiktok.com/@djibyshop" target="_blank">TikTok</a>
  <a href="https://wa.me/33745098191" target="_blank">💬 WhatsApp</a>
</section>

<div id="orderModal" class="modal">
  <button onclick="closeOrder()" class="back-btn">⬅ Retour au site</button>

  <div class="box">
    <h2>Informations client</h2>
    <p id="selectedText"></p>

    <form id="orderForm">
      <input id="firstName" placeholder="Prénom" required>
      <input id="lastName" placeholder="Nom de famille" required>
      <input id="email" type="email" placeholder="Email" required>
      <input id="phone" placeholder="Téléphone Sénégal" required>
      <input id="address" placeholder="Adresse Sénégal" required>
      <button class="btn" type="submit">Continuer vers paiement</button>
    </form>
  </div>
</div>

<div id="bigImage">
  <span class="back" onclick="hideImage()">⬅</span>
  <img id="bigImagePhoto">
</div>

<button id="topBtn" onclick="goTop()">⬆</button>

<script>
const API_URL = "https://djiby-sho.onrender.com";

let selectedProduct = null;
let detailProduct = null;
let detailIndex = 0;

const products = [
{ id:1, name:"Produit 1", price:500, stock:5, images:["lu.jpeg","p1-2.jpeg","p1-3.jpeg"], current:0, description:"• Bonne qualité<br>• Livraison Sénégal" },
{ id:2, name:"Produit 2", price:5500, stock:10, images:["p2-1.jpeg","p2-2.jpeg","p2-3.jpeg"], current:0, description:"• Produit vérifié<br>• Disponible" },

{ id:6, name:"Produit 6", price:7500, stock:9, images:["p6-1.jpeg","p6-2.jpeg","p6-3.jpeg"], current:0, description:"• Très bonne qualité<br>• Livraison disponible" },

{ id:8, name:"Produit 8", price:8500, stock:11, images:["p8-1.jpeg","p8-2.jpeg","p8-3.jpeg"], current:0, description:"• Produit vérifié<br>• Qualité premium" },
{ id:9, name:"Produit 9", price:9000, stock:5, images:["p9-1.jpeg","p9-2.jpeg","p9-3.jpeg"], current:0, description:"• Livraison Sénégal<br>• Bon état" },
{ id:10, name:"Produit 10", price:9500, stock:15, images:["p10-1.jpeg","p10-2.jpeg","p10-3.jpeg"], current:0, description:"• Produit populaire<br>• Disponible" },

{ id:12, name:"Produit 12", price:10500, stock:6, images:["p12-1.jpeg","p12-2.jpeg","p12-3.jpeg"], current:0, description:"• Produit original<br>• Disponible" },
{ id:13, name:"Produit 13", price:11000, stock:8, images:["p13-1.jpeg","p13-2.jpeg","p13-3.jpeg"], current:0, description:"• Très demandé<br>• Haute qualité" },
{ id:14, name:"Produit 14", price:11500, stock:10, images:["p14-1.jpeg","p14-2.jpeg","p14-3.jpeg"], current:0, description:"• Design élégant<br>• Livraison possible" },

{ id:16, name:"Produit 16", price:12500, stock:6, images:["p16-1.jpeg","p16-2.jpeg","p16-3.jpeg"], current:0, description:"• Bonne finition<br>• Produit vérifié" },
{ id:17, name:"Produit 17", price:13000, stock:7, images:["p17-1.jpeg","p17-2.jpeg","p17-3.jpeg"], current:0, description:"• Qualité premium<br>• Disponible" },
{ id:18, name:"Produit 18", price:13500, stock:8, images:["p18-1.jpeg","p18-2.jpeg","p18-3.jpeg"], current:0, description:"• Livraison rapide<br>• Bon produit" },

{ id:21, name:"Produit 21", price:15000, stock:5, images:["p21-1.jpeg","p21-2.jpeg","p21-3.jpeg"], current:0, description:"• Produit premium<br>• Disponible" },
{ id:22, name:"Produit 22", price:15500, stock:6, images:["p22-1.jpeg","p22-2.jpeg","p22-3.jpeg"], current:0, description:"• Design moderne<br>• Haute qualité" },

{ id:24, name:"Produit 24", price:16500, stock:8, images:["p24-1.jpeg","p24-2.jpeg","p24-3.jpeg"], current:0, description:"• Livraison rapide<br>• Produit vérifié" },
{ id:25, name:"Produit 25", price:17000, stock:9, images:["p25-1.jpeg","p25-2.jpeg","p25-3.jpeg"], current:0, description:"• Très populaire<br>• Disponible" },
{ id:26, name:"Produit 26", price:17500, stock:10, images:["p26-1.jpeg","p26-2.jpeg","p26-3.jpeg"], current:0, description:"• Bonne qualité<br>• Livraison Sénégal" },
{ id:27, name:"Produit 27", price:18000, stock:5, images:["p27-1.jpeg","p27-2.jpeg","p27-3.jpeg"], current:0, description:"• Produit premium<br>• Disponible maintenant" }
];

function checkRobot(){
  if(document.getElementById("robotAnswer").value == "7"){
    document.getElementById("robot").style.display = "none";
    localStorage.setItem("robot_ok", "true");
    localStorage.setItem("robot_time", Date.now());
  }else{
    document.getElementById("robotError").innerText = "Réponse incorrecte";
  }
}

window.onload = function(){
  const ok = localStorage.getItem("robot_ok");
  const time = localStorage.getItem("robot_time");

  if(ok === "true" && time){
    const now = Date.now();
    if(now - time < 86400000){
      document.getElementById("robot").style.display = "none";
    }
  }
}

function renderProducts(list){
  const box = document.getElementById("products");
  box.innerHTML = "";

  list.forEach(p=>{
    box.innerHTML += `
      <div class="card simple-card" onclick="showProductDetails(${p.id})">
        <img class="product-main-img" src="${p.images[0]}">
        <div class="simple-price">${p.price} FCFA</div>
      </div>`;
  });
}

function searchProducts(){
  const text = document.getElementById("searchInput").value.toLowerCase();
  renderProducts(products.filter(p => p.name.toLowerCase().includes(text)));
}

function showProductDetails(id){
  detailProduct = products.find(item => item.id === id);
  detailIndex = 0;

  document.getElementById("detailMainImage").src = detailProduct.images[detailIndex];
  document.getElementById("detailName").innerText = detailProduct.name;
  document.getElementById("detailPrice").innerText = detailProduct.price + " FCFA";
  document.getElementById("detailDescription").innerHTML = detailProduct.description;
  document.getElementById("detailStock").innerText = "Produit restant : " + detailProduct.stock;

  const btn = document.getElementById("detailPayBtn");

  if(detailProduct.stock <= 0){
    btn.innerText = "Produit indisponible";
    btn.className = "btn out";
    btn.onclick = function(){
      alert("Ce produit est indisponible");
    };
  }else{
    btn.innerText = "Payer ce produit";
    btn.className = "btn";
    btn.onclick = function(){
      closeProductDetails();
      openOrder(detailProduct.id);
    };
  }

  document.getElementById("productDetail").style.display = "flex";
}

function changeDetailImage(direction){
  if(!detailProduct) return;

  detailIndex = detailIndex + direction;

  if(detailIndex < 0){
    detailIndex = detailProduct.images.length - 1;
  }

  if(detailIndex >= detailProduct.images.length){
    detailIndex = 0;
  }

  document.getElementById("detailMainImage").src = detailProduct.images[detailIndex];
}

function closeProductDetails(){
  document.getElementById("productDetail").style.display = "none";
}

function openOrder(id){
  selectedProduct = products.find(p => p.id === id);

  document.getElementById("selectedText").innerText =
  selectedProduct.name + " - " + selectedProduct.price + " FCFA";

  document.getElementById("orderModal").style.display = "flex";
}

function closeOrder(){
  document.getElementById("orderModal").style.display = "none";
}

document.getElementById("orderForm").addEventListener("submit", function(e){
  e.preventDefault();

  const customer = {
    firstName: document.getElementById("firstName").value,
    lastName: document.getElementById("lastName").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value
  };

  fetch(API_URL + "/create-payment", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      product: selectedProduct,
      customer: customer
    })
  })
  .then(res => res.json())
  .then(data => {
    if(data.success){
      window.location.href = data.payment_url;
    }else{
      alert(data.message || "Produit indisponible");
    }
  })
  .catch(() => alert("Backend non connecté"));
});

function hideImage(){
  document.getElementById("bigImage").style.display = "none";
}

function goTop(){
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

renderProducts(products);
</script>

</body>
</html>
