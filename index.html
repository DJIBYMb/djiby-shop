<!DOCTYPE html>
<html>
<head>
<title>DJIBY SHOP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:white;color:black}
header{background:black;color:white;text-align:center;padding:20px;font-size:34px;font-weight:bold}
nav{text-align:center;background:#eee;padding:15px}
nav a{color:black;text-decoration:none;margin:10px;font-weight:bold}
.hero{text-align:center;padding:30px}
.search{text-align:center;padding:15px}
.search input{width:85%;max-width:500px;padding:15px;border:2px solid black;border-radius:12px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{border:2px solid black;border-radius:15px;overflow:hidden;box-shadow:0 4px 10px #aaa}
.slider{position:relative}
.slider img{width:100%;height:140px;object-fit:cover;cursor:pointer}
.slide-btn{position:absolute;top:45%;background:black;color:white;border:none;border-radius:50%;width:30px;height:30px}
.prev{left:5px}
.next{right:5px}
.content{padding:12px}
.desc{background:#f4f4f4;padding:10px;border-radius:10px;font-size:13px}
.price{font-weight:bold;margin:10px 0;font-size:18px}
.btn{background:black;color:white;padding:12px;border:none;border-radius:10px;width:100%;font-weight:bold}
.contact{background:black;color:white;text-align:center;padding:30px}
.contact a{display:block;color:white;text-decoration:none;margin:12px}
#topBtn{position:fixed;right:20px;bottom:20px;border-radius:50%;width:55px;height:55px;background:black;color:white;font-size:25px}
.modal,#robot,#bigImage{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);justify-content:center;align-items:center;z-index:9999}
#robot{display:flex}
.box{background:white;color:black;padding:25px;border-radius:20px;width:90%;max-width:420px;text-align:center}
.box input{width:100%;padding:13px;margin:8px 0;border:2px solid black;border-radius:10px;box-sizing:border-box}
#bigImage img{max-width:90%;max-height:85%}
.back{position:absolute;top:20px;left:20px;color:white;font-size:45px;cursor:pointer}
</style>
</head>

<body>

<div id="robot">
  <div class="box">
    <h2>Vérification sécurité</h2>
    <p>Combien fait 4 + 3 ?</p>
    <input id="robotAnswer" type="number" placeholder="Réponse">
    <button class="btn" onclick="checkRobot()">Entrer</button>
    <p id="robotError"></p>
  </div>
</div>

<header>DJIBY SHOP</header>

<nav>
<a href="#products">Articles</a>
<a href="#contact">Contact</a>
</nav>

<section class="hero">
<h1>Bienvenue sur DJIBY SHOP 🛒</h1>
<p>Produits de qualité — paiement sécurisé</p>
</section>

<div class="search">
<input id="searchInput" onkeyup="searchProducts()" placeholder="Rechercher un produit...">
</div>

<section id="products" class="products"></section>

<section id="contact" class="contact">
<h2>Contact</h2>
<a href="mailto:tonemail@gmail.com">📧 tonemail@gmail.com</a>
<a href="https://www.tiktok.com/@dji.efootbal" target="_blank">🎵 Mon TikTok</a>
<a href="https://wa.me/33745098191" target="_blank">💬 WhatsApp</a>
</section>

<div id="orderModal" class="modal">
  <div class="box">
    <h2>Informations client</h2>
    <p id="selectedText"></p>

    <form id="orderForm">
      <input id="firstName" placeholder="Prénom" required>
      <input id="lastName" placeholder="Nom de famille" required>
      <input id="email" type="email" placeholder="Email" required>
      <input id="phone" placeholder="Téléphone Sénégal" required>
      <input id="address" placeholder="Adresse Sénégal" required>
      <button class="btn" type="submit">Continuer vers paiement</button>
    </form>
  </div>
</div>

<div id="bigImage">
<span class="back" onclick="hideImage()">⬅</span>
<img id="bigImagePhoto">
</div>

<button id="topBtn" onclick="goTop()">⬆</button>

<script>
const API_URL = "http://localhost:8000";
let selectedProduct = null;

const products = [];
for(let i=1;i<=27;i++){
  products.push({
    id:i,
    name:"Produit " + i,
    price:3000 + i * 500,
    images:[
      "article" + i + "-1.jpg",
      "article" + i + "-2.jpg",
      "article" + i + "-3.jpg"
    ],
    current:0,
    description:"• Bonne qualité<br>• Livraison disponible au Sénégal<br>• Produit vérifié<br>• Disponible maintenant"
  });
}

function checkRobot(){
  if(document.getElementById("robotAnswer").value == "7"){
    document.getElementById("robot").style.display="none";
  }else{
    document.getElementById("robotError").innerText="Réponse incorrecte";
  }
}

function renderProducts(list){
  const box=document.getElementById("products");
  box.innerHTML="";

  list.forEach(p=>{
    box.innerHTML += `
      <div class="card">
        <div class="slider">
          <button class="slide-btn prev" onclick="changeImage(${p.id}, -1)">‹</button>
          <img id="img-${p.id}" src="${p.images[p.current]}" onclick="showImage(this.src)">
          <button class="slide-btn next" onclick="changeImage(${p.id}, 1)">›</button>
        </div>

        <div class="content">
          <h2>${p.name}</h2>
          <div class="desc">${p.description}</div>
          <div class="price">${p.price} FCFA</div>
          <button class="btn" onclick="openOrder(${p.id})">Payer ce produit</button>
        </div>
      </div>`;
  });
}

function changeImage(id, direction){
  const p = products.find(item => item.id === id);
  p.current = p.current + direction;

  if(p.current < 0){
    p.current = p.images.length - 1;
  }

  if(p.current >= p.images.length){
    p.current = 0;
  }

  document.getElementById("img-" + id).src = p.images[p.current];
}

function searchProducts(){
  const text=document.getElementById("searchInput").value.toLowerCase();
  renderProducts(products.filter(p=>p.name.toLowerCase().includes(text)));
}

function openOrder(id){
  selectedProduct=products.find(p=>p.id===id);
  document.getElementById("selectedText").innerText=selectedProduct.name+" - "+selectedProduct.price+" FCFA";
  document.getElementById("orderModal").style.display="flex";
}

document.getElementById("orderForm").addEventListener("submit",function(e){
  e.preventDefault();

  const customer={
    firstName:document.getElementById("firstName").value,
    lastName:document.getElementById("lastName").value,
    email:document.getElementById("email").value,
    phone:document.getElementById("phone").value,
    address:document.getElementById("address").value
  };

  fetch(API_URL+"/create-payment",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({product:selectedProduct,customer:customer})
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.success){
      window.location.href=data.payment_url;
    }else{
      alert("Erreur paiement : "+data.message);
    }
  })
  .catch(()=>alert("Backend non connecté"));
});

function showImage(src){
  document.getElementById("bigImage").style.display="flex";
  document.getElementById("bigImagePhoto").src=src;
}

function hideImage(){
  document.getElementById("bigImage").style.display="none";
}

function goTop(){
  window.scrollTo({top:0,behavior:"smooth"});
}

renderProducts(products);
</script>

</body>
</html>
